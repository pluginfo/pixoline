<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="PixOLine Support. Get help and support for the PixOLine graphic design application.">

  <title>Support — PixOLine</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 8% 8px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo img {
      display: block;
      max-height: 42px;
      width: auto;
    }

    nav a {
      color: #c9d1d9;
      text-decoration: none;
      margin-left: 25px;
      font-size: 15px;
      transition: 0.2s;
    }

    nav a:hover {
      color: #58a6ff;
    }

    /*
      Main content intentionally omitted.
      Support page currently contains only the shared
      PixOLine header and footer.
    */

    footer {
      margin-top: auto;
      text-align: center;
      padding: 35px 20px;
      background: #161b22;
      border-top: 1px solid #30363d;
      color: #8b949e;
    }

    footer a {
      color: #58a6ff;
      text-decoration: none;
    }

    .footer-links {
      margin-bottom: 15px;
    }

    .footer-links a {
      margin: 0 10px;
      font-size: 14px;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {

      header {
        flex-direction: column;
        gap: 15px;
      }

      nav a {
        margin: 0 7px;
      }

      .footer-links a {
        display: block;
        margin: 8px 0;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="logo">
      <a href="https://pluginfotech.github.io/pixoline/" title="PixOLine">
        <img src="pixoline_logo_white.png" alt="PixOLine">
      </a>
    </div>

    <nav>
      <a href="about.html">About</a>
      <a href="features.html">Features</a>
      <a href="learn.html">Learn</a>
      <a href="download.html">Download</a>
    </nav>

  </header>


  <!-- SUPPORT CONTENT WILL BE ADDED HERE LATER -->


  <!-- FOOTER -->

  <footer>

    <div class="footer-links">
      <a href="about.html">About</a>
      <a href="support.html">Support</a>
      <a href="privacy-and-policy.html">Privacy Policy</a>
      <a href="terms-and-conditions.html">Terms of Service</a>
      <a href="contact.html">Contact Us</a>
    </div>

    <p>
      © 2026 PixOLine. All rights reserved.
    </p>

  </footer>

</body>
</html>
